<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Generator — Pollinations Z</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #888; margin-bottom: 32px; font-size: 0.9rem; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 720px;
    }
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #f0f0f0;
      font-size: 1rem;
      padding: 14px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #a78bfa; }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    select, input[type="number"] {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #f0f0f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input[type="number"]:focus { border-color: #a78bfa; }
    .btn {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 28px;
      transition: opacity 0.2s, transform 0.1s;
      margin-left: auto;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .result-area {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .img-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #output-img {
      width: 100%;
      display: none;
      border-radius: 14px;
    }
    #status {
      color: #888;
      font-size: 0.9rem;
      text-align: center;
    }
    .spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .download-btn {
      background: #1e3a5f;
      border: 1px solid #2563eb;
      border-radius: 8px;
      color: #60a5fa;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 8px 20px;
      text-decoration: none;
      display: none;
    }
    .download-btn:hover { background: #1e40af; }
  </style>
</head>
<body>
  <h1>🎨 Image Generator</h1>
  <p class="subtitle">Powered by Pollinations · Model flux-z</p>

  <div class="card">
    <textarea id="prompt" placeholder="Décris l'image que tu veux générer...&#10;Ex: a futuristic city at night, cyberpunk style, neon lights"></textarea>
    <div class="controls">
      <select id="model">
        <option value="flux">flux (défaut)</option>
        <option value="flux-realism">flux-realism</option>
        <option value="flux-anime">flux-anime</option>
        <option value="flux-3d">flux-3d</option>
        <option value="turbo">turbo</option>
      </select>
      <select id="width">
        <option value="512">512px</option>
        <option value="768">768px</option>
        <option value="1024" selected>1024px</option>
        <option value="1280">1280px</option>
      </select>
      <select id="height">
        <option value="512">512px</option>
        <option value="768">768px</option>
        <option value="1024" selected>1024px</option>
        <option value="1280">1280px</option>
      </select>
      <button class="btn" id="gen-btn" onclick="generate()">Générer</button>
    </div>
  </div>

  <div class="result-area">
    <div id="status">Entre un prompt et clique sur Générer</div>
    <div class="img-wrapper">
      <div class="spinner" id="spinner"></div>
      <img id="output-img" alt="Image générée">
    </div>
    <a id="download-btn" class="download-btn" download="image.jpg">⬇ Télécharger</a>
  </div>

  <script>
    const API_KEY = "sk_Wn9j2Z5qOdd4gyH4M6H7M7XzT4lgnRmL";

    function generate() {
      const prompt = document.getElementById("prompt").value.trim();
      if (!prompt) { alert("Entre un prompt d'abord !"); return; }

      const model  = document.getElementById("model").value;
      const width  = document.getElementById("width").value;
      const height = document.getElementById("height").value;
      const seed   = Math.floor(Math.random() * 999999);

      const encoded = encodeURIComponent(prompt);
      const url = `https://image.pollinations.ai/prompt/${encoded}?model=${model}&width=${width}&height=${height}&seed=${seed}&token=${API_KEY}&nologo=true`;

      const img     = document.getElementById("output-img");
      const spinner = document.getElementById("spinner");
      const status  = document.getElementById("status");
      const btn     = document.getElementById("gen-btn");
      const dlBtn   = document.getElementById("download-btn");

      img.style.display = "none";
      dlBtn.style.display = "none";
      spinner.style.display = "block";
      status.textContent = "Génération en cours…";
      btn.disabled = true;

      img.onload = () => {
        spinner.style.display = "none";
        img.style.display = "block";
        status.textContent = `✅ Image générée (${width}×${height}) — modèle : ${model}`;
        dlBtn.href = url;
        dlBtn.style.display = "inline-block";
        btn.disabled = false;
      };

      img.onerror = () => {
        spinner.style.display = "none";
        status.textContent = "❌ Erreur lors de la génération. Vérifie la clé API ou réessaie.";
        btn.disabled = false;
      };

      img.src = url;
    }

    document.getElementById("prompt").addEventListener("keydown", e => {
      if (e.ctrlKey && e.key === "Enter") generate();
    });
  </script>
</body>
</html>
